setup.</text><text x="44" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#222" >WIRE LIST — connect in this order, switch OFF, bank unplugged</text><text x="44" y="134" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1864ab" >POWER  (use 2 jumpers side by side for ①②④ if you can)</text><text x="56" y="156" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >1</text><text x="76" y="156" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Breakout VBUS  →  switch pin 1</text><text x="56" y="177.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >2</text><text x="76" y="177.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Switch pin 2  →  PCA9685 screw terminal V+</text><text x="56" y="199.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >3</text><text x="76" y="199.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Switch pin 2  →  ESP32 5V pin   (this is jumper J1)</text><text x="56" y="220.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >4</text><text x="76" y="220.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Breakout GND  →  PCA9685 screw terminal GND</text><text x="56" y="242.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >5</text><text x="76" y="242.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Breakout GND  →  ESP32 GND (left side, beside GPIO13)</text><text x="56" y="263.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >6</text><text x="76" y="263.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >1000 µF across PCA9685 screw V+ / GND, stripe to GND</text><text x="56" y="285.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >7</text><text x="76" y="285.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >470 µF across ESP32 5V / GND, stripe to GND</text><text x="44" y="312.5" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1864ab" >LOGIC  (all 3.3 V)</text><text x="56" y="334.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >8</text><text x="76" y="334.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >ESP32 3V3  →  PCA9685 VCC (left header)</text><text x="56" y="356.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >9</text><text x="76" y="356.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >ESP32 GPIO22  →  PCA9685 SCL (left header)</text><text x="56" y="377.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >10</text><text x="76" y="377.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >ESP32 GPIO21  →  PCA9685 SDA (left header)</text><text x="56" y="399.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >11</text><text x="76" y="399.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >PCA9685 VCC (right header)  →  OLED VCC</text><text x="56" y="420.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >12</text><text x="76" y="420.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >PCA9685 GND (right header)  →  OLED GND</text><text x="56" y="442.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >13</text><text x="76" y="442.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >PCA9685 SCL (right header)  →  OLED SCL</text><text x="56" y="463.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >14</text><text x="76" y="463.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >PCA9685 SDA (right header)  →  OLED SDA</text><text x="44" y="491.0" font-size="11.5" text-anchor="start" font-weight="bold" fill="#1864ab" >SERVOS</text><text x="56" y="513.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >15</text><text x="76" y="513.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Servo 1 → ch0, Servo 2 → ch1 (brown wire on the GND row)</text><text x="44" y="540.5" font-size="11.5" text-anchor="start" font-weight="bold" fill="#c92a2a" >LEAVE UNCONNECTED  ✕</text><text x="56" y="562.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >–</text><text x="76" y="562.5" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >PCA9685 OE, left-header GND, and both header V+ pins</text><text x="56" y="584.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222" >–</text><text x="76" y="584.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222" >Never connect servo power to the ESP32 5V or 3V3 pins</text><text x="44" y="650" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555" font-style="italic" >Why no GND wire on the PCA9685 left header: its ground already arrives through the</text><text x="44" y="664" font-size="10.5" text-anchor="start" font-weight="normal" fill="#555" font-style="italic" >screw-terminal GND wire. Adding one would make a loop that sends servo current through the ESP32.</text><text x="894" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#2b8a3e" >CHECKS  (meter on DC volts)</text><text x="894" y="124" font-size="11.3" text-anchor="start" font-weight="normal" fill="#222" >A  Bank in, switch ON, nothing else wired: breakout VBUS to GND = 4.9–5.2 V  (0 V → no CC resistors, tell me)</text><text x="894" y="145" font-size="11.3" text-anchor="start" font-weight="normal" fill="#222" >B  Everything wired, no servos: OLED lights; I2C scan finds 0x3C (OLED) and 0x40 (PCA9685)</text><text x="894" y="166" font-size="11.3" text-anchor="start" font-weight="normal" fill="#222" >C  Plug servos only with switch OFF. Then move both at once: ESP32 5V pin stays ≥ 4.6 V</text><text x="894" y="187" font-size="11.3" tex
