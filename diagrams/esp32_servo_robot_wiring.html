nt-weight="bold" fill="#7048e8" >SCL</text><text x="560" y="425" font-size="10" text-anchor="start" font-weight="bold" fill="#1971c2" >SDA</text><text x="752" y="600" font-size="9.5" text-anchor="end" font-weight="bold" fill="#1b1b1b" >single logic↔servo</text><text x="752" y="612" font-size="9.5" text-anchor="end" font-weight="bold" fill="#1b1b1b" >GND join point</text><text x="1100" y="589" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#e03131" >GND not linked:</text><text x="1100" y="601" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#e03131" >common via pack</text><text x="1526" y="476" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222" >0.96″ OLED</text><text x="1526" y="491" font-size="10" text-anchor="middle" font-weight="normal" fill="#222" >SSD1306 · 0x3C</text><text x="1526" y="507" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#c92a2a" >pin order varies:</text><text x="1526" y="519" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#c92a2a" >read YOUR silkscreen</text><text x="1446" y="484" font-size="10" text-anchor="start" font-weight="bold" fill="#222" >VCC</text><text x="1446" y="534" font-size="10" text-anchor="start" font-weight="bold" fill="#222" >SCL</text><text x="1446" y="559" font-size="10" text-anchor="start" font-weight="bold" fill="#222" >SDA</text><text x="1446" y="584" font-size="10" text-anchor="start" font-weight="bold" fill="#222" >GND</text><text x="790" y="803" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >servo plug: brown = GND · red = V+ · orange = PWM; plugs straight into the PCA9685 header (servo current never reaches breadboard or ESP32)</text><text x="510" y="844.0" font-size="12" text-anchor="start" font-weight="bold" fill="#111" >GROUND TOPOLOGY</text><text x="510" y="858.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >Servo current loop: pack → buck → PCA screw</text><text x="510" y="873.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >terminal → servo → back the same thick wires.</text><text x="510" y="887.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >Logic GND meets servo GND at ONE point only:</text><text x="510" y="902.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >PCA#1 header GND. Bank has no other ground.</text><text x="510" y="916.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >No GND jumper PCA#1↔PCA#2: boards are already</text><text x="510" y="931.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >common through the bucks; a jumper would make</text><text x="510" y="945.5" font-size="10.5" text-anchor="start" font-weight="normal" fill="#333" >a loop carrying servo current in a Dupont wire.</text><text x="812" y="831.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#c92a2a" >⚠ THINGS THAT DESTROY PARTS</text><text x="812" y="847.3" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >1  Never connect a PCA9685 side-header V+ pin to the ESP32, the breadboard or the other board (✕). Do not use a 6-wire ribbon between boards.</text><text x="812" y="863.6" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >2  Check each buck reads 5.0 V with NO load before any servo is plugged in. Reversed input polarity kills the MP2338: check with the meter first.</text><text x="812" y="879.9" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >3  Electrolytic caps: the stripe is NEGATIVE. A reversed cap can vent or burst. Use ≥25 V caps on the 12.6 V pack side.</text><text x="812" y="896.2" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >4  Encoder &quot;+&quot;, buzzer VCC, OLED VCC and PCA VCC go to 3V3 ONLY. 5 V there pushes 5 V into ESP32 GPIOs.</text><text x="812" y="912.5" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >5  Li-ion: fuse right at pack +, BMS fitted, never short the leads; charge only with a 3S CC/CV charger and a balancing BMS.</text><text x="812" y="928.8" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >6  Turn SW2 OFF whenever the laptop USB is plugged into the ESP32, so the bank and the PC never feed the 5 V net together.</text><text x="812" y="945.1" font-size="10.6" text-anchor="start" font-weight="normal" fill="#222" >7  Never plug or unplug servos with SW1 on. A servo plug reversed on the header puts V+ on the signal pin.</text><text x="42" y="982" font-size="13" text-anchor="start" font-weight="bold" fill="#222" >LEGEND</text><text x="94" y="1008" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Servo pack 9–12.6 V (thick = 20 AWG)</text><text x="394" y="1008" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Servo 5.0 V rails A / B (thick)</text><text x="694" y="1008" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Power ground (thick)</text><text x="994" y="1008" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Logic 5 V from power bank</text><text x="1294" y="1008" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >3V3 logic rail</text><text x="94" y="1032" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Logic ground (thin jumper)</text><text x="394" y="1032" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >I2C SDA</text><text x="694" y="1032" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >I2C SCL</text><text x="994" y="1032" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >GPIO signal (OE, encoder, buzzer)</text><text x="1294" y="1032" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Optional (not owned resistors)</text><text x="94" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Junction (filled dot) = connected</text><text x="384" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Hop = crossing, NOT connected</text><text x="630" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Module pin</text><text x="754" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Leave unconnected</text><text x="948" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Not owned: must buy</text><text x="1148" y="1066" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >Future servo (S7–S10): no rewiring</text><text x="42" y="1096" font-size="11.5" text-anchor="start" font-weight="bold" fill="#222" >ESP32 pin labels:</text><text x="192" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >used here</text><text x="309.4" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >boot strapping: avoid</text><text x="506.0" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >internal flash: never</text><text x="702.6" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >input-only</text><text x="826.6" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >UART0 / USB programming</text><text x="1036.4" y="1096" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222" >power / EN</text><text x="1574" y="1096" font-size="11" text-anchor="end" font-weight="normal" fill="#555" font-style="italic" >Not used in Design A: MT3608 ×2, OLED #2 (spares)</text><text x="1574" y="1112" font-size="11" text-anchor="end" font-weight="normal" fill="#555" font-style="italic" >MG90S stall 0.7 A each (your figure) · PCA9685 boards share I2C and OE only</text></svg></div></body></html>
